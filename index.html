<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>岔路口｜可核验的国考选择沙盘</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { color-scheme: light; --ink:#17243b; --muted:#65738b; --line:#dfe6ef; --paper:#f4f7fb; --card:#fff; --blue:#2457d6; --green:#11845b; --red:#cf3f4f; --amber:#a86500; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:var(--paper); color:var(--ink); }
    header { padding:28px 4vw 22px; background:#14243f; color:white; }
    header h1 { margin:0 0 8px; font-size:30px; letter-spacing:1px; }
    header p { margin:0; color:#dce7ff; font-size:16px; }
    main { max-width:1500px; margin:0 auto; padding:24px 3vw 40px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 8px 28px #2031540a; }
    .import-grid { display:grid; grid-template-columns:minmax(300px,.8fr) minmax(400px,1.4fr); gap:20px; }
    h2 { margin:0 0 14px; font-size:20px; }
    h3 { margin:0 0 10px; font-size:16px; }
    .muted { color:var(--muted); line-height:1.65; }
    .file-label { display:block; border:2px dashed #9bb2dc; border-radius:12px; padding:24px; text-align:center; color:var(--blue); font-weight:650; cursor:pointer; background:#f7faff; }
    .file-label:hover { background:#edf3ff; }
    input[type=file] { margin-top:16px; width:100%; }
    .status { margin-top:14px; min-height:24px; line-height:1.55; }
    .error { color:var(--red); white-space:pre-wrap; }
    .success { color:var(--green); }
    .metric { display:inline-block; margin:0 10px 10px 0; padding:12px 16px; border-radius:12px; background:#eef3ff; }
    .metric strong { display:block; font-size:25px; color:var(--blue); }
    .sheet-list { display:grid; gap:8px; margin-top:12px; }
    .sheet-row { display:flex; justify-content:space-between; gap:16px; padding:10px 12px; border-radius:9px; background:#f7f9fc; }
    code { word-break:break-all; }
    .hidden { display:none; }
    .workspace { display:grid; grid-template-columns:310px minmax(0,1fr); gap:20px; margin-top:20px; align-items:start; }
    .profile-form { display:grid; gap:13px; }
    .profile-form label { display:grid; gap:6px; font-size:13px; font-weight:650; color:#43516a; }
    .profile-form input, .profile-form select { width:100%; border:1px solid #cbd6e5; border-radius:9px; padding:10px 11px; background:white; color:var(--ink); font:inherit; }
    .location-box { max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:10px; padding:8px; display:grid; gap:4px; }
    .location-box label { display:flex; grid-template-columns:auto 1fr; align-items:center; gap:8px; padding:5px 7px; font-weight:400; border-radius:6px; }
    .location-box label:hover { background:#f0f4fa; }
    .location-box input { width:auto; }
    .clear-locations { border:1px solid #cbd6e5; border-radius:9px; padding:9px 12px; background:white; color:var(--blue); cursor:pointer; font:inherit; }
    .clear-locations:hover { background:#edf3ff; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
    .stat { border:1px solid var(--line); border-radius:13px; padding:17px; background:white; text-align:left; cursor:pointer; }
    .stat strong { display:block; font-size:31px; line-height:1.1; }
    .stat span { display:block; margin-top:6px; color:var(--muted); }
    .stat.active { outline:3px solid #2457d633; border-color:var(--blue); }
    .stat.pass strong { color:var(--green); }
    .stat.fail strong { color:var(--red); }
    .stat.pending strong { color:var(--amber); }
    .position-list { display:grid; gap:9px; }
    .position-row { width:100%; border:1px solid var(--line); background:white; border-radius:11px; padding:13px 15px; text-align:left; cursor:pointer; color:var(--ink); }
    .position-row:hover { border-color:#8ba8df; background:#f8faff; }
    .position-row strong { display:block; margin-bottom:5px; }
    .position-row small { color:var(--muted); }
    .badge { display:inline-block; border-radius:999px; padding:3px 8px; font-size:12px; margin-left:7px; }
    .badge.pass { background:#e5f6ee; color:var(--green); }
    .badge.fail { background:#ffedef; color:var(--red); }
    .badge.pending { background:#fff4dc; color:var(--amber); }
    .list-tools { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:12px 0; }
    .list-tools button { border:1px solid var(--line); background:white; border-radius:8px; padding:7px 12px; cursor:pointer; }
    .list-tools button:disabled { opacity:.4; cursor:default; }
    .delta { border-radius:12px; padding:14px 16px; margin-bottom:16px; background:#eef3ff; }
    .delta.positive { background:#e5f6ee; color:#086444; }
    .delta.negative { background:#ffedef; color:#a12d3a; }
    .delta-number { display:inline-block; font-size:34px; font-weight:800; margin-right:12px; }
    .delta-list { display:grid; gap:7px; max-height:240px; overflow:auto; margin-top:12px; }
    dialog { width:min(1050px,92vw); max-height:88vh; border:0; border-radius:16px; padding:0; color:var(--ink); }
    dialog::backdrop { background:#0c1729aa; }
    .dialog-head { display:flex; justify-content:space-between; gap:16px; align-items:start; padding:20px 24px; background:#14243f; color:white; }
    .dialog-head h2 { margin:0; }
    .dialog-head button { border:1px solid #ffffff66; border-radius:8px; background:transparent; color:white; padding:7px 12px; cursor:pointer; }
    .dialog-body { padding:22px 24px; overflow:auto; }
    .trace-box { padding:13px 15px; border-radius:10px; background:#edf3ff; line-height:1.75; margin-bottom:16px; }
    .condition { border-left:5px solid; border-radius:8px; padding:11px 13px; margin:8px 0; }
    .condition.pass { border-color:var(--green); background:#eef9f4; }
    .condition.fail { border-color:var(--red); background:#fff0f1; }
    .condition.pending { border-color:var(--amber); background:#fff7e7; }
    .condition strong { display:block; margin-bottom:4px; }
    .condition p { margin:4px 0; line-height:1.55; }
    .raw-table { width:100%; border-collapse:collapse; table-layout:fixed; }
    .raw-table th, .raw-table td { border:1px solid var(--line); padding:8px 10px; vertical-align:top; text-align:left; word-break:break-word; }
    .raw-table th { width:180px; background:#f5f7fa; }
    @media (max-width:1000px) { .workspace { grid-template-columns:1fr; } }
    @media (max-width:850px) { .import-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>岔路口</h1>
    <p>所有数字由程序从官方职位表算出，可点开查看原表行号</p>
  </header>
  <main>
    <section class="import-grid">
      <div class="card">
        <h2>导入 2027 国考职位表</h2>
        <p class="muted">选择国家公务员局发布的原始 Excel。文件只在当前浏览器中解析，不会上传到服务器。</p>
        <label class="file-label" for="excelFile">选择官方 .xls 文件</label>
        <input id="excelFile" type="file" accept=".xls,.xlsx">
        <div id="importStatus" class="status muted">尚未导入文件</div>
      </div>
      <div class="card">
        <h2>原表结构核验</h2>
        <div id="importSummary" class="muted">导入后显示真实 sheet、表头和职位记录数。</div>
      </div>
    </section>
    <section id="workspace" class="workspace hidden">
      <aside class="card">
        <h2>我的画像</h2>
        <div class="profile-form">
          <label>标准专业名称<input id="major" value="法学" autocomplete="off"></label>
          <label>学历<select id="education"><option>大专</option><option selected>本科</option><option>硕士研究生</option><option>博士研究生</option></select></label>
          <label>学位<select id="degree"><option>无</option><option selected>学士</option><option>硕士</option><option>博士</option><option>不确定</option></select></label>
          <label>政治面貌<select id="political"><option selected>群众</option><option>共青团员</option><option>中共党员</option></select></label>
          <label>毕业届别<select id="graduate"><option>2027届</option><option>非2027届</option><option selected>不确定</option></select></label>
          <label>基层工作年限<select id="grassroots"><option>无经验</option><option>一年</option><option selected>二年</option><option>三年</option><option>五年以上</option><option>不确定</option></select></label>
          <label>搜索并多选工作地点<input id="locationSearch" placeholder="输入省、市或区县筛选" autocomplete="off"></label>
          <div id="locationOptions" class="location-box"></div>
          <button id="clearLocations" type="button" class="clear-locations">清空已选地点</button>
        </div>
      </aside>
      <div class="card">
        <h2>程序筛选结果</h2>
        <div id="deltaPanel" class="muted">修改工作地点后，在这里查看变化量和新增职位。</div>
        <div id="stats" class="stats"></div>
        <div id="listTitle" class="muted"></div>
        <div id="positionList" class="position-list"></div>
        <div class="list-tools">
          <button id="prevPage" type="button">上一页</button>
          <span id="pageInfo" class="muted"></span>
          <button id="nextPage" type="button">下一页</button>
        </div>
      </div>
    </section>
    <dialog id="detailDialog">
      <div class="dialog-head"><h2 id="detailTitle">职位原表依据</h2><button id="closeDetail" type="button">关闭</button></div>
      <div id="detailBody" class="dialog-body"></div>
    </dialog>
  </main>
  <script>
    const EXPECTED_HEADERS = ["部门代码","部门名称","用人司局","机构性质","招考职位","职位属性","职位分布","职位简介","职位代码","机构层级","考试类别","招考人数","专业","学历","学位","政治面貌","基层工作最低年限","服务基层项目工作经历","是否在面试阶段组织专业能力测试","面试人员比例","工作地点","落户地点","备注","部门网站","咨询电话1","咨询电话2","咨询电话3"];
    const state = {
      positions:[], meta:null, evaluated:[], activeStatus:"符合", page:1, pageSize:50, locationCounts:[], baseline:null, delta:null,
      profile:{ major:"法学", education:"本科", degree:"学士", political:"群众", graduate:"不确定", grassroots:"二年", locations:["北京市东城区"] }
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
    }

    function parseWorkbook(arrayBuffer, fileName, fileHash) {
      if (typeof XLSX === "undefined") throw new Error("SheetJS 未加载，请联网后刷新页面");
      const workbook = XLSX.read(arrayBuffer, { type:"array" });
      const positions = [];
      const sheets = [];
      const version = `sha256:${fileHash}`;
      for (const sheetName of workbook.SheetNames) {
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header:1, raw:false, defval:"" });
        const hasContent = rows.some(row => row.some(value => String(value ?? "").trim()));
        if (!hasContent) continue;
        if (rows.length < 2) throw new Error(`${sheetName} 缺少第 2 行表头`);
        const headers = rows[1].map(value => String(value ?? "").trim());
        const missing = EXPECTED_HEADERS.filter((header, index) => headers[index] !== header);
        if (missing.length || headers.length !== EXPECTED_HEADERS.length) {
          throw new Error(`${sheetName} 表头与官方 27 列不一致，已停止筛选`);
        }
        let count = 0;
        for (let index = 2; index < rows.length; index += 1) {
          const values = rows[index];
          if (!values.some(value => String(value ?? "").trim())) continue;
          const raw = Object.fromEntries(headers.map((header, column) => [header, String(values[column] ?? "")]));
          positions.push({
            id:`${version}::${sheetName}::${index + 1}`,
            raw,
            trace:{ source_file:fileName, sheet:sheetName, excel_row:index + 1, sha256:fileHash }
          });
          count += 1;
        }
        sheets.push({ name:sheetName, count, firstRow:3, lastRow:rows.length });
      }
      if (!positions.length) throw new Error("没有找到可解析的职位记录");
      return { positions, meta:{ fileName, fileHash, version, sheets, total:positions.length, headers:[...EXPECTED_HEADERS] } };
    }

    const STATUS = { PASS:"符合", FAIL:"不符", PENDING:"待确认" };

    function check(key, label, status, expected, actual, reason) {
      return { key, label, status, expected:String(expected ?? ""), actual:String(actual ?? ""), reason };
    }

    function matchEducation(required, actual) {
      const rank = { "大专":1, "本科":2, "硕士研究生":3, "博士研究生":4 };
      if (!(actual in rank)) return null;
      if (required.startsWith("仅限")) return actual === required.slice(2);
      if (required === "本科或硕士研究生") return ["本科","硕士研究生"].includes(actual);
      if (required === "大专或本科") return ["大专","本科"].includes(actual);
      if (required.endsWith("及以上")) return rank[actual] >= rank[required.slice(0,-3)];
      return null;
    }

    function matchDegree(required, actual, education) {
      if (required === "无要求") return true;
      if (!actual || actual === "不确定") return null;
      const corresponding = { "大专":"无", "本科":"学士", "硕士研究生":"硕士", "博士研究生":"博士" };
      const expected = required === "与最高学历相对应的学位" ? corresponding[education] : required;
      if (!expected) return null;
      return actual === expected;
    }

    function matchPolitical(required, actual) {
      if (required === "不限") return true;
      if (required === "中共党员") return actual === "中共党员";
      if (required === "中共党员或共青团员") return ["中共党员","共青团员"].includes(actual);
      return null;
    }

    function matchGrassroots(required, actual) {
      if (required === "无限制") return true;
      const years = { "无经验":0, "一年":1, "二年":2, "三年":3, "五年以上":5 };
      if (!(actual in years) || !(required in years)) return null;
      return years[actual] >= years[required];
    }

    function majorStage(text, education) {
      const stage = ["硕士研究生","博士研究生"].includes(education) ? "研究生" : "本科";
      if (!/本科：|研究生：/.test(text)) return { stage, segment:text };
      const match = text.match(new RegExp(`${stage}：([\\s\\S]*?)(?=\\s*(?:本科|研究生)：|$)`));
      return { stage, segment:match ? match[1].trim() : "" };
    }

    function normalizeMajorItem(item) {
      return item.replace(/^\d+[A-Z]?/i, "").replace(/[（(][0-9A-Z]+[）)]/gi, "").replace(/专业$/, "").trim();
    }

    function matchMajor(required, actual, education) {
      const text = required.replace(/\s+/g, " ").trim();
      if (["不限","专业不限"].includes(text)) return true;
      if (!actual.trim()) return null;
      const { segment } = majorStage(text, education);
      if (!segment) return null;
      if (/[（(][^）)]*[、，][^）)]*[）)]/.test(segment)) return null;
      const items = segment.split(/[、，,；;。\n]+/).map(item => item.trim()).filter(Boolean);
      const target = actual.trim();
      for (const item of items) {
        const withoutCode = item.replace(/[（(][0-9A-Z]+[）)]/gi, "");
        if (/[（）()]|类|相关|方向|限|不含|除外|等|或/.test(withoutCode)) continue;
        if (normalizeMajorItem(item) === target) return true;
      }
      return null;
    }

    function isContactOnly(remark) {
      const residual = remark
        .replace(/[\d０-９\s\-—－–—_：:，,。.、;；（）()]/g, "")
        .replace(/咨询电话|联系电话|电话|无/g, "");
      return residual.trim() === "";
    }

    function evaluatePosition(position, profile) {
      const raw = position.raw;
      const checks = [];
      const major = matchMajor(raw["专业"], profile.major, profile.education);
      checks.push(check("major","专业",major === true ? STATUS.PASS : STATUS.PENDING,`${raw["专业"]}（按${profile.education}阶段）`,profile.major,major === true ? "专业项明确匹配" : "专业大类、方向、跨阶段或其他歧义需咨询招录机关"));

      const education = matchEducation(raw["学历"], profile.education);
      checks.push(check("education","学历",education === true ? STATUS.PASS : education === false ? STATUS.FAIL : STATUS.PENDING,raw["学历"],profile.education,education === false ? "学历不满足原表条件" : education === null ? "学历条件无法确定" : "学历条件匹配"));

      const degree = matchDegree(raw["学位"], profile.degree, profile.education);
      checks.push(check("degree","学位",degree === true ? STATUS.PASS : degree === false ? STATUS.FAIL : STATUS.PENDING,raw["学位"],profile.degree,degree === false ? "学位与学历要求不对应" : degree === null ? "学位信息不足" : "学位条件匹配"));

      const political = matchPolitical(raw["政治面貌"], profile.political);
      checks.push(check("political","政治面貌",political === true ? STATUS.PASS : political === false ? STATUS.FAIL : STATUS.PENDING,raw["政治面貌"],profile.political,political === false ? "政治面貌不满足" : political === null ? "政治面貌无法确定" : "政治面貌匹配"));

      const remark = raw["备注"].trim();
      let remarkStatus = STATUS.PENDING;
      let remarkReason = "备注含未完全核验的限制，必须查看原文";
      if (!remark || isContactOnly(remark)) {
        remarkStatus = STATUS.PASS;
        remarkReason = remark ? "备注仅为联系信息" : "原表备注为空";
      } else if (/限\s*2027\s*届|2027\s*年应届/.test(remark) && profile.graduate === "非2027届") {
        remarkStatus = STATUS.FAIL;
        remarkReason = "原表明确限定2027届，当前届别不符";
      } else if (/限\s*应届|限\s*2027\s*届|2027\s*年应届/.test(remark)) {
        remarkReason = "应届身份、届别或备注其他限制未完全核实";
      }
      checks.push(check("remark","应届与备注",remarkStatus,remark || "空",profile.graduate,remarkReason));

      const grassroots = matchGrassroots(raw["基层工作最低年限"], profile.grassroots);
      checks.push(check("grassroots","基层年限",grassroots === true ? STATUS.PASS : grassroots === false ? STATUS.FAIL : STATUS.PENDING,raw["基层工作最低年限"],profile.grassroots,grassroots === false ? "基层工作年限不足" : grassroots === null ? "基层年限信息不足" : "基层年限匹配"));

      const servicePass = raw["服务基层项目工作经历"] === "无限制";
      checks.push(check("service","服务基层身份",servicePass ? STATUS.PASS : STATUS.PENDING,raw["服务基层项目工作经历"],"本次未采集",servicePass ? "原表无限制" : "服务基层身份未核实，不得判符合"));

      const locations = Array.isArray(profile.locations) ? profile.locations : [];
      const location = raw["工作地点"];
      const locationMatched = locations.some(item => location === item || location.startsWith(item));
      const locationStatus = !locations.length ? STATUS.PENDING : locationMatched ? STATUS.PASS : STATUS.FAIL;
      checks.push(check("location","工作地点",locationStatus,location,locations.join("、") || "未选择",!locations.length ? "尚未选择可接受地点" : locationMatched ? "工作地点可接受" : "工作地点不在可接受范围"));

      const status = checks.some(item => item.status === STATUS.FAIL) ? STATUS.FAIL : checks.some(item => item.status === STATUS.PENDING) ? STATUS.PENDING : STATUS.PASS;
      return { status, checks };
    }

    window.ChalukouRules = { STATUS, evaluatePosition, matchEducation, matchDegree, matchPolitical, matchGrassroots, matchMajor };

    function renderImportSummary() {
      const { meta } = state;
      document.getElementById("importSummary").innerHTML = `
        <div class="metric"><strong>${meta.total}</strong><span>条真实职位记录</span></div>
        <div class="metric"><strong>${meta.sheets.length}</strong><span>个数据 sheet</span></div>
        <p class="muted">表头：第 2 行｜首条职位：第 3 行｜空白 sheet 已跳过</p>
        <div class="sheet-list">${meta.sheets.map(sheet => `<div class="sheet-row"><span>${escapeHtml(sheet.name)}</span><strong>${sheet.count} 条</strong></div>`).join("")}</div>
        <p class="muted">文件 SHA256<br><code>${escapeHtml(meta.fileHash)}</code></p>`;
    }

    function buildLocationOptions() {
      const query = document.getElementById("locationSearch").value.trim();
      const matches = state.locationCounts.filter(item => !query || item.name.includes(query)).slice(0,30).map(item => item.name);
      const names = [...new Set([...state.profile.locations, ...matches])];
      document.getElementById("locationOptions").innerHTML = names.length ? names.map(name => `
        <label><input type="checkbox" value="${escapeHtml(name)}" ${state.profile.locations.includes(name) ? "checked" : ""}><span>${escapeHtml(name)}</span></label>`).join("") : "<span class=\"muted\">没有匹配的地点</span>";
    }

    function prepareWorkspace() {
      const counts = new Map();
      for (const position of state.positions) {
        const name = position.raw["工作地点"];
        counts.set(name, (counts.get(name) || 0) + 1);
      }
      state.locationCounts = [...counts.entries()].map(([name,count]) => ({name,count})).sort((a,b) => b.count - a.count || a.name.localeCompare(b.name,"zh-CN"));
      document.getElementById("workspace").classList.remove("hidden");
      buildLocationOptions();
      recalculate();
    }

    function nonLocationProfileKey() {
      const { locations, ...rest } = state.profile;
      return JSON.stringify(rest);
    }

    function recalculate({ locationChange = false } = {}) {
      if (!locationChange) {
        state.baseline = null;
        state.delta = null;
      }
      const previous = state.baseline;
      state.evaluated = state.positions.map(position => ({ position, result:evaluatePosition(position, state.profile) }));
      const passIds = new Set(state.evaluated.filter(entry => entry.result.status === STATUS.PASS).map(entry => entry.position.id));
      const key = nonLocationProfileKey();
      if (locationChange && previous && previous.version === state.meta.version && previous.key === key) {
        const added = state.evaluated.filter(entry => entry.result.status === STATUS.PASS && !previous.passIds.has(entry.position.id)).map(entry => entry.position);
        state.delta = { before:previous.passIds.size, after:passIds.size, change:passIds.size - previous.passIds.size, added };
      } else {
        state.delta = null;
      }
      state.baseline = { version:state.meta.version, key, passIds };
      state.page = 1;
      renderDelta();
      renderStats();
      renderList();
    }

    function renderDelta() {
      const panel = document.getElementById("deltaPanel");
      if (!state.delta) {
        panel.className = "muted";
        panel.textContent = "当前地点组合是比较基线；修改地点后显示变化量和新增职位。";
        return;
      }
      const { before, after, change, added } = state.delta;
      const sign = change > 0 ? `+${change}` : `${change}`;
      panel.className = change > 0 ? "delta positive" : change < 0 ? "delta negative" : "delta";
      panel.innerHTML = `<div class="delta-number">${sign}</div><strong>符合职位 ${before} → ${after}</strong><span>｜新增 ${added.length} 个，仅归因于工作地点变化</span>${added.length ? `<div class="delta-list">${added.map(position => `<button type="button" class="position-row" data-id="${escapeHtml(position.id)}"><strong>${escapeHtml(position.raw["部门名称"])}｜${escapeHtml(position.raw["招考职位"])}</strong><small>${escapeHtml(position.raw["工作地点"])}｜${escapeHtml(position.trace.sheet)} 第 ${position.trace.excel_row} 行</small></button>`).join("")}</div>` : "<p>本次没有新增符合职位。</p>"}`;
    }

    function renderStats() {
      const definitions = [
        { status:STATUS.PASS, className:"pass", hint:"全部已核实条件满足" },
        { status:STATUS.PENDING, className:"pending", hint:"存在无法确认的条件" },
        { status:STATUS.FAIL, className:"fail", hint:"至少一项明确不满足" }
      ];
      document.getElementById("stats").innerHTML = definitions.map(item => {
        const count = state.evaluated.filter(entry => entry.result.status === item.status).length;
        return `<button type="button" class="stat ${item.className} ${state.activeStatus === item.status ? "active" : ""}" data-status="${item.status}"><strong>${count}</strong><span>${item.status}｜${item.hint}</span></button>`;
      }).join("");
    }

    function renderList() {
      const filtered = state.evaluated.filter(entry => entry.result.status === state.activeStatus);
      const pages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
      state.page = Math.min(state.page, pages);
      const start = (state.page - 1) * state.pageSize;
      const visible = filtered.slice(start, start + state.pageSize);
      const className = state.activeStatus === STATUS.PASS ? "pass" : state.activeStatus === STATUS.FAIL ? "fail" : "pending";
      document.getElementById("listTitle").textContent = `${state.activeStatus}职位，共 ${filtered.length} 条；点击职位查看原表依据`;
      document.getElementById("positionList").innerHTML = visible.map(({position}) => `
        <button type="button" class="position-row" data-id="${escapeHtml(position.id)}">
          <strong>${escapeHtml(position.raw["部门名称"])}｜${escapeHtml(position.raw["招考职位"])}<span class="badge ${className}">${state.activeStatus}</span></strong>
          <small>职位代码 ${escapeHtml(position.raw["职位代码"])}｜${escapeHtml(position.raw["工作地点"])}<br>${escapeHtml(position.trace.sheet)}｜Excel 第 ${position.trace.excel_row} 行</small>
        </button>`).join("") || "<p class=\"muted\">当前分类没有职位。</p>";
      document.getElementById("pageInfo").textContent = `第 ${state.page} / ${pages} 页`;
      document.getElementById("prevPage").disabled = state.page <= 1;
      document.getElementById("nextPage").disabled = state.page >= pages;
    }

    function renderPositionDetail(id) {
      const entry = state.evaluated.find(item => item.position.id === id);
      if (!entry) return;
      const { position, result } = entry;
      document.getElementById("detailTitle").textContent = `${position.raw["部门名称"]}｜${position.raw["招考职位"]}`;
      document.getElementById("detailBody").innerHTML = `
        <div class="trace-box"><strong>原表位置</strong><br>文件：${escapeHtml(position.trace.source_file)}<br>Sheet：${escapeHtml(position.trace.sheet)}｜Excel 第 <strong>${position.trace.excel_row}</strong> 行<br><small>SHA256：${escapeHtml(position.trace.sha256)}</small></div>
        <h3>逐项判定（不符标红，待确认标黄）</h3>
        ${result.checks.map(item => `<div class="condition ${item.status === STATUS.PASS ? "pass" : item.status === STATUS.FAIL ? "fail" : "pending"}"><strong>${escapeHtml(item.label)}｜${item.status}</strong><p>原表：${escapeHtml(item.expected)}</p><p>我的输入：${escapeHtml(item.actual)}</p><p>${escapeHtml(item.reason)}</p></div>`).join("")}
        <p class="muted">资格结论以招录机关审核为准；待确认项请结合原表备注和咨询电话核实。</p>
        <h3>原表全部 27 列</h3>
        <table class="raw-table"><tbody>${Object.entries(position.raw).map(([key,value]) => `<tr><th>${escapeHtml(key)}</th><td>${escapeHtml(value || "（空）")}</td></tr>`).join("")}</tbody></table>`;
      const dialog = document.getElementById("detailDialog");
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
    }

    async function handleFile(file) {
      const status = document.getElementById("importStatus");
      try {
        status.className = "status muted";
        status.textContent = "正在计算文件哈希并读取原表…";
        const buffer = await file.arrayBuffer();
        if (!crypto.subtle) throw new Error("当前浏览器无法计算 SHA256，请使用新版 Edge 或 Chrome");
        const digest = await crypto.subtle.digest("SHA-256", buffer);
        const fileHash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2,"0")).join("");
        const parsed = parseWorkbook(buffer, file.name, fileHash);
        state.positions = parsed.positions;
        state.meta = parsed.meta;
        renderImportSummary();
        prepareWorkspace();
        status.className = "status success";
        status.textContent = `已读取 ${file.name}`;
      } catch (error) {
        state.positions = [];
        state.meta = null;
        state.evaluated = [];
        document.getElementById("workspace").classList.add("hidden");
        document.getElementById("importSummary").textContent = "导入失败，未生成任何筛选数字。";
        status.className = "status error";
        status.textContent = error.message;
      }
    }

    for (const key of ["major","education","degree","political","graduate","grassroots"]) {
      document.getElementById(key).addEventListener("change", event => {
        state.profile[key] = event.target.value;
        recalculate();
      });
    }
    document.getElementById("locationSearch").addEventListener("input", buildLocationOptions);
    document.getElementById("locationOptions").addEventListener("change", () => {
      state.profile.locations = [...document.getElementById("locationOptions").querySelectorAll("input:checked")].map(input => input.value);
      recalculate({ locationChange:true });
    });
    document.getElementById("clearLocations").addEventListener("click", () => {
      state.profile.locations = [];
      document.getElementById("locationSearch").value = "";
      buildLocationOptions();
      recalculate({ locationChange:true });
    });
    document.getElementById("stats").addEventListener("click", event => {
      const button = event.target.closest("button[data-status]");
      if (!button) return;
      state.activeStatus = button.dataset.status;
      state.page = 1;
      renderStats();
      renderList();
    });
    document.getElementById("prevPage").addEventListener("click", () => { state.page -= 1; renderList(); });
    document.getElementById("nextPage").addEventListener("click", () => { state.page += 1; renderList(); });
    document.getElementById("positionList").addEventListener("click", event => {
      const button = event.target.closest("button[data-id]");
      if (button) renderPositionDetail(button.dataset.id);
    });
    document.getElementById("deltaPanel").addEventListener("click", event => {
      const button = event.target.closest("button[data-id]");
      if (button) renderPositionDetail(button.dataset.id);
    });
    document.getElementById("closeDetail").addEventListener("click", () => document.getElementById("detailDialog").close());
    document.getElementById("excelFile").addEventListener("change", event => {
      if (event.target.files[0]) handleFile(event.target.files[0]);
    });

    window.Chalukou = { parseWorkbook, state, EXPECTED_HEADERS };
    window.ChalukouUI = { prepareWorkspace, recalculate, renderStats, renderList, buildLocationOptions, renderPositionDetail };
  </script>
</body>
</html>
